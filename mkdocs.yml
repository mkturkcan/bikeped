site_name: bikeped
site_description: Pedestrian-cyclist collision warning for urban intersections, with the testbench and simulators behind arXiv 2604.17046.
site_author: Mehmet Kerem Turkcan
site_url: https://mkturkcan.github.io/bikeped/
site_dir: docs
docs_dir: docs_src
repo_url: https://github.com/mkturkcan/bikeped
repo_name: mkturkcan/bikeped
edit_uri: ""
copyright: Mehmet Kerem Turkcan. Companion code for arXiv 2604.17046.

# Pages generated by tools/build_docs.py are pulled into hand-written pages
# with snippets; they are not pages of their own.
exclude_docs: |
  _generated/

not_in_nav: |
  /index.html

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: media/favicon.svg
  favicon: media/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  homepage: ./
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mkturkcan/bikeped
      name: Source on GitHub
    - icon: fontawesome/solid/file-lines
      link: https://arxiv.org/abs/2604.17046
      name: Paper on arXiv
    - icon: fontawesome/solid/database
      link: https://huggingface.co/datasets/mehmetkeremturkcan/bikeped
      name: Dataset on Hugging Face

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [., calibration, tools]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            members_order: source
            heading_level: 2
            merge_init_into_class: true
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs_src]
      check_paths: false
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

nav:
  - Start:
    - start/index.md
    - Install: start/install.md
    - Quickstart: start/quickstart.md
    - Repository layout: start/repository.md
  - System:
    - system/index.md
    - Perception: system/perception.md
    - Decision pipeline: system/decision.md
    - Safety model: system/safety-model.md
    - Uncertainty: system/uncertainty.md
  - Scenarios:
    - scenarios/index.md
    - Conformance suite: scenarios/conformance.md
    - Extended suites: scenarios/extended.md
    - Authoring: scenarios/authoring.md
    - Generators: scenarios/generators.md
  - Simulation:
    - simulation/index.md
    - Browser simulator: simulation/browser.md
    - Offline testbench: simulation/testbench.md
    - CARLA:
      - simulation/carla/index.md
      - Unreal Engine 4: simulation/carla/ue4.md
      - Unreal Engine 5: simulation/carla/ue5.md
      - Cameras: simulation/carla/cameras.md
      - Environment: simulation/carla/environment.md
      - Actors: simulation/carla/actors.md
      - Ground truth: simulation/carla/ground-truth.md
      - Output: simulation/carla/output.md
      - Troubleshooting: simulation/carla/troubleshooting.md
  - Experiments:
    - experiments/index.md
    - Optimizer: experiments/optimizer.md
    - Latency: experiments/latency.md
    - Camera placement: experiments/placement.md
  - Deploy:
    - Calibration: calibration/index.md
    - Bridge starter kit: deployment/index.md
    - Tuning: deployment/tuning.md
    - Hardware: deployment/hardware.md
  - Reference:
    - CLI: reference/cli.md
    - Configuration: reference/config.md
    - File formats: reference/formats.md
    - API:
      - api/index.md
      - decision_pipeline: api/decision_pipeline.md
      - decision_testbench: api/decision_testbench.md
      - sim_visualizer: api/sim_visualizer.md
      - generate_figures: api/generate_figures.md
      - run_experiments: api/run_experiments.md
      - run_height_pitch_sweep: api/run_height_pitch_sweep.md
      - crosswalk_analysis: api/crosswalk_analysis.md
      - calibrate_fisheye: api/calibrate_fisheye.md
      - capture_calibration: api/capture_calibration.md
      - compare_fisheye_models: api/compare_fisheye_models.md
      - eval_models: api/eval_models.md
      - latency_report: api/latency_report.md
      - bikeped.scenarios: api/bikeped_scenarios.md
      - bikeped.sim: api/bikeped_sim.md
    - Dataset: dataset.md
    - FAQ: faq.md
    - Changelog: changelog.md
    - Citing: citing.md
